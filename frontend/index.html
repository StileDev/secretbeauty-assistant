<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Secret Beauty — Assistante</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app" id="app">

  <div class="overlay" id="overlay"></div>

  <div class="sidebar">
    <div class="sidebar-header">
    <div class="brand-mark"><img src="assets/logo.jpeg" alt="Secret Beauty" width=""></div>      <div class="brand-title">Secret Beauty</div>
    </div>

    <button class="new-chat-btn" id="newChatBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      Nouvelle discussion
    </button>

    <div class="sidebar-section-label">Discussions</div>
    <div class="conversation-list" id="convList"></div>

    <div class="sidebar-footer">
      <div class="footer-avatar">EM</div>
      <div class="footer-label">Ebah Malaurie · Secret Beauty</div>
    </div>
  </div>

  <div class="main">
    <div class="top-bar">
      <button class="menu-btn" id="menuBtn" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div>
        <div class="top-bar-title" id="topTitle">Assistante Secret Beauty</div>
        <div class="top-bar-status"><span class="status-dot"></span><span id="topStatus">en ligne · lun–sam</span></div>
      </div>
      <button class="icon-btn" id="themeToggle" aria-label="Changer de thème" style="margin-left:auto;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
      </button>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="chat-inner" id="chatInner"></div>
    </div>

    <div class="quick-replies" id="quickReplies">
      <button class="chip" data-msg="Quels sont vos services ?">Nos services</button>
      <button class="chip" data-msg="Quels sont vos horaires ?">Horaires</button>
      <button class="chip" data-msg="Comment commander ?">Commander</button>
      <button class="chip" data-msg="Quels produits vendez-vous ?">Nos produits</button>
    </div>

    <div class="input-zone">
      <div class="input-wrap">
        <input type="text" id="userInput" placeholder="Écris ton message..." autocomplete="off">
        <button class="send-btn" id="sendBtn" aria-label="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12L20 4L13 20L11 13L4 12Z" fill="#241A1F"/></svg>
        </button>
      </div>
      <div class="disclaimer">Secret Beauty · Soins &amp; cosmétiques — réponses automatiques</div>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="script.js"></script>
</body>
</html>
